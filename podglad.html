<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podgląd 3D — wystawa</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #e9e7e2; }
    a-scene canvas { touch-action: none; cursor: grab; }
    a-scene canvas:active { cursor: grabbing; }
    #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px;
             align-items: center; padding: 10px 16px; background: rgba(255,255,255,.9); font-size: 14px; }
    #tytul { flex-basis: 100%; }
    #tytul b { font-size: 16px; }
    #tytul span { color: #555; }
    button { font: inherit; padding: 6px 10px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
    #pomoc { position: fixed; left: 0; right: 0; bottom: 12px; z-index: 10; text-align: center; font-size: 13px; color: #555;
             pointer-events: none; }
  </style>
</head>
<body>
  <div id="panel">
    <div id="tytul">Ładowanie…</div>
    <button data-widok="persp">Perspektywa</button>
    <button data-widok="gora">Z góry</button>
    <label><input type="checkbox" id="przezr"> przezroczysty (sprawdzenie skali)</label>
    <a id="ar" href="#">Otwórz AR</a>
    <a href="./">← wszystkie prace</a>
  </div>
  <div id="pomoc">Przeciągnij, aby obrócić · kółko myszy lub dwa palce, aby przybliżyć</div>

  <script>
    // Półprzezroczystość modelu — do sprawdzenia, czy ściany pokrywają się z rzutem
    AFRAME.registerComponent('przezroczystosc', {
      schema: { type: 'number', default: 1 },
      init() { this.el.addEventListener('model-loaded', () => this.update()); },
      update() {
        const mesh = this.el.getObject3D('mesh'); if (!mesh) return;
        mesh.traverse((o) => {
          if (!o.material) return;
          [].concat(o.material).forEach((m) => {
            if (m.userData.przezr === undefined) m.userData.przezr = { transparent: m.transparent, opacity: m.opacity };
            const p = this.data < 1;
            m.transparent = p || m.userData.przezr.transparent;
            m.opacity = p ? this.data : m.userData.przezr.opacity;
            m.depthWrite = !p; m.needsUpdate = true;
          });
        });
      },
    });

    // Obracanie kamery wokół znacznika (oś Z = w górę, prostopadle do kartki)
    AFRAME.registerComponent('orbita', {
      init() {
        this.az = 0;                 // obrót wokół modelu (0 = patrzymy od dołu kartki, czyli od południa)
        this.el_ = 35;               // wysokość kamery nad kartką, w stopniach
        this.zoom = 1;
        this.fov = 40;
        this.auto = true;            // powolne samoczynne obracanie do pierwszego dotknięcia
        this.wskazniki = new Map();
        const cam = this.el.object3D;
        cam.up.set(0, 0, 1);

        const canvas = this.el.sceneEl.canvas;
        canvas.addEventListener('pointerdown', (e) => {
          this.auto = false;
          canvas.setPointerCapture(e.pointerId);
          this.wskazniki.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });
        canvas.addEventListener('pointermove', (e) => {
          const p = this.wskazniki.get(e.pointerId); if (!p) return;
          if (this.wskazniki.size === 1) {
            this.az -= (e.clientX - p.x) * 0.4;
            this.ustawWysokosc(this.el_ + (e.clientY - p.y) * 0.3);
          } else if (this.wskazniki.size === 2) {
            const [a, b] = [...this.wskazniki.values()];
            const przed = Math.hypot(a.x - b.x, a.y - b.y);
            p.x = e.clientX; p.y = e.clientY;
            const po = Math.hypot(a.x - b.x, a.y - b.y);
            if (przed > 0 && po > 0) this.ustawZoom(this.zoom * przed / po);
          }
          p.x = e.clientX; p.y = e.clientY;
        });
        const koniec = (e) => this.wskazniki.delete(e.pointerId);
        canvas.addEventListener('pointerup', koniec);
        canvas.addEventListener('pointercancel', koniec);
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault(); this.auto = false;
          this.ustawZoom(this.zoom * Math.exp(e.deltaY * 0.001));
        }, { passive: false });
      },
      ustawWysokosc(st) {
        this.el_ = Math.min(89.9, Math.max(5, st));
        if (this.el_ < 89 && this.fov < 10) this.fov = 40; // z widoku "z góry" wracamy do zwykłej perspektywy
      },
      ustawZoom(z) { this.zoom = Math.min(3, Math.max(0.3, z)); },
      widok(nazwa) {
        this.auto = false;
        if (nazwa === 'gora') { this.az = 0; this.el_ = 89.9; this.fov = 2.2; this.zoom = 1; }
        else { this.az = 0; this.el_ = 35; this.fov = 40; this.zoom = 1; }
      },
      tick(t, dt) {
        if (this.auto && dt) this.az += dt * 0.006;
        // Odległość dobrana tak, by kartka mieściła się w kadrze przy każdym kącie widzenia
        const r = 0.75 * this.zoom / Math.tan(THREE.MathUtils.degToRad(this.fov / 2));
        const a = THREE.MathUtils.degToRad(this.az), e = THREE.MathUtils.degToRad(this.el_);
        const cam = this.el.object3D;
        cam.position.set(r * Math.cos(e) * Math.sin(a), -r * Math.cos(e) * Math.cos(a), r * Math.sin(e));
        cam.lookAt(0, 0, 0);
        cam.rotateY(Math.PI); // lookAt zwykłego obiektu kieruje na cel oś +Z, a kamera patrzy wzdłuż −Z
        const c = this.el.components.camera.camera;
        const near = Math.max(0.01, r - 3), far = r + 10;
        if (c.fov !== this.fov || c.near !== near || c.far !== far) {
          c.fov = this.fov; c.near = near; c.far = far; c.updateProjectionMatrix();
        }
      },
    });
  </script>
  <script type="module">
    import { wczytajPrace, znajdzPrace, htmlModelu, DEKODERY } from './wspolne.js';

    const dane = await wczytajPrace();
    const praca = znajdzPrace(dane, new URLSearchParams(location.search).get('p'));
    document.title = `${praca.tytul} — podgląd 3D`;
    document.getElementById('tytul').innerHTML = `<b>${praca.tytul}</b> · ${praca.autor}` +
      (praca.opis ? `<br><span>${praca.opis}</span>` : '');
    document.getElementById('ar').href = `ar.html?p=${encodeURIComponent(praca.id)}`;

    const img = new Image();
    img.src = praca.znacznik;
    await img.decode();
    const h = img.naturalHeight / img.naturalWidth; // proporcje znacznika (zwykle 1)
    const grubosc = 0.02;                            // grubość podstawki (w szerokościach znacznika)

    document.body.insertAdjacentHTML('beforeend', `
      <a-scene renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false"
               light="defaultLightsEnabled: false" shadow="type: pcfsoft" background="color: #e9e7e2" ${DEKODERY}>
        <a-assets><img id="znacznik" src="${praca.znacznik}"></a-assets>
        <a-entity id="kamera" camera look-controls="enabled: false" wasd-controls="enabled: false" orbita></a-entity>

        <a-entity light="type: hemisphere; color: #ffffff; groundColor: #8a7f70; intensity: 1.1" position="0 0 1"></a-entity>
        <a-entity light="type: directional; intensity: 1.6; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048;
                         shadowCameraLeft: -0.8; shadowCameraRight: 0.8; shadowCameraTop: 0.8; shadowCameraBottom: -0.8;
                         shadowCameraNear: 0.1; shadowCameraFar: 5; shadowBias: -0.0005"
                  position="0.6 -0.8 1.5"></a-entity>

        <!-- Podstawka: rysunek znacznika na cienkiej płycie -->
        <a-plane src="#znacznik" width="1" height="${h}" position="0 0 0.0005" shadow="receive: true"
                 material="roughness: 1; metalness: 0"></a-plane>
        <a-box width="1" height="${h}" depth="${grubosc}" position="0 0 ${-grubosc / 2}" color="#f4f2ee"></a-box>

        ${htmlModelu(praca, 'przezroczystosc="1" shadow="cast: true; receive: true"')}
      </a-scene>`);

    const orbita = () => document.getElementById('kamera').components.orbita;
    document.querySelectorAll('[data-widok]').forEach((b) => b.onclick = () => orbita().widok(b.dataset.widok));
    document.getElementById('przezr').onchange = (e) => {
      document.querySelector('[przezroczystosc]').setAttribute('przezroczystosc', e.target.checked ? 0.55 : 1);
    };
  </script>
</body>
</html>
