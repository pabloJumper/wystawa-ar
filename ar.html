<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR — wystawa</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // MindAR prosi o kamerę bez rozdzielczości — przeglądarki dają wtedy 640×480 (rozmazany obraz).
    // Prosimy o HD i ciągły autofokus. MindAR analizuje każdą klatkę w pełnej rozdzielczości,
    // więc Full HD spowalnia śledzenie — 1280×720 to kompromis. Do testów: ar.html?p=...&kamera=1080 (albo 480).
    // Przeglądarka pomija ustawienia, których telefon nie obsługuje.
    (() => {
      const md = navigator.mediaDevices;
      if (!md || !md.getUserMedia) return;
      const oryginal = md.getUserMedia.bind(md);
      const wys = { '480': [640, 480], '720': [1280, 720], '1080': [1920, 1080] }[
        new URLSearchParams(location.search).get('kamera') || '720'] || [1280, 720];
      md.getUserMedia = (c) => {
        if (c && c.video && typeof c.video === 'object') {
          c = { ...c, video: { ...c.video, width: { ideal: wys[0] }, height: { ideal: wys[1] },
                               advanced: [{ focusMode: 'continuous' }] } };
        }
        return oryginal(c);
      };
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
    #info { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 16px;
            background: rgba(0,0,0,.55); color: #fff; font-size: 14px; }
    #info b { font-size: 16px; }
    #info a { color: #fff; }
  </style>
</head>
<body>
  <div id="info">Ładowanie…</div>
  <script type="module">
    import { wczytajPrace, znajdzPrace, htmlModelu, SWIATLA, DEKODERY } from './wspolne.js';

    const info = document.getElementById('info');
    try {
      const dane = await wczytajPrace();
      const id = new URLSearchParams(location.search).get('p');
      const praca = znajdzPrace(dane, id);
      document.title = `${praca.tytul} — AR`;
      info.innerHTML = `<b>${praca.tytul}</b> · ${praca.autor}<br>Skieruj aparat na znacznik. <a href="./">Wszystkie prace</a>`;

      // Wygładzanie ruchu (OneEuroFilter). Domyślne wartości MindAR: cf 0.001, beta 1000.
      // Mniejsze cf = mniej drgań; większa beta = mniejsze opóźnienie przy szybkim ruchu.
      // Do testów na telefonie bez zmian w plikach: ar.html?p=...&cf=0.0005&beta=500
      const q = new URLSearchParams(location.search);
      const cf = parseFloat(q.get('cf')) || 0.001;
      const beta = parseFloat(q.get('beta')) || 1000;

      document.body.insertAdjacentHTML('beforeend', `
        <a-scene mindar-image="imageTargetSrc: ${praca.mind}; filterMinCF: ${cf}; filterBeta: ${beta}; missTolerance: 5; warmupTolerance: 5"
                 renderer="colorManagement: true; antialias: true"
                 color-space="sRGB" vr-mode-ui="enabled: false"
                 device-orientation-permission-ui="enabled: false"
                 light="defaultLightsEnabled: false" ${DEKODERY}>
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          <a-entity mindar-image-target="targetIndex: 0">
            ${SWIATLA}
            ${htmlModelu(praca)}
          </a-entity>
        </a-scene>`);
    } catch (e) {
      info.textContent = 'Błąd: ' + e.message;
    }
  </script>
</body>
</html>
