<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR 256 px (test) — wystawa</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- TEST: kopia MindAR 1.2.5 ze śledzeniem na obrazku 256 px zamiast 128 px (jedna zmiana: i9=1 -> i9=0) -->
  <script src="libs/mindar-256.js"></script>
  <!-- Wszystkie ustawienia AR (kamera, wygładzanie) są w pliku ustawienia.js -->
  <script src="ustawienia.js"></script>
  <script>
    // Wartości z ustawienia.js, nadpisywane parametrami z adresu (do testów).
    (() => {
      const u = window.USTAWIENIA_AR, q = new URLSearchParams(location.search);
      const liczba = (nazwa) => { const v = parseFloat(q.get(nazwa)); return Number.isFinite(v) ? v : u[nazwa]; };
      window.AR = {
        kamera: liczba('kamera'), autofokus: u.autofokus, cf: liczba('cf'), beta: liczba('beta'),
        klatkiDoPokazania: u.klatkiDoPokazania, klatkiDoUkrycia: u.klatkiDoUkrycia,
        slonceKierunek: u.slonceKierunek, slonceJasnosc: u.slonceJasnosc, swiatloOtoczenia: u.swiatloOtoczenia,
      };
    })();

    // MindAR prosi o kamerę bez rozdzielczości — przeglądarki dają wtedy 640×480 (rozmazany obraz).
    // Tu dokładamy rozdzielczość i autofokus. Telefon pomija ustawienia, których nie obsługuje.
    (() => {
      const md = navigator.mediaDevices;
      if (!md || !md.getUserMedia) return;
      const oryginal = md.getUserMedia.bind(md);
      const [w, h] = { 480: [640, 480], 720: [1280, 720], 1080: [1920, 1080] }[window.AR.kamera] || [1280, 720];
      md.getUserMedia = (c) => {
        if (c && c.video && typeof c.video === 'object') {
          const video = { ...c.video, width: { ideal: w }, height: { ideal: h } };
          if (window.AR.autofokus) video.advanced = [{ focusMode: 'continuous' }];
          c = { ...c, video };
        }
        return oryginal(c);
      };
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif; }
    #info { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 16px;
            background: rgba(0,0,0,.55); color: #fff; font-size: 14px; }
    #info b { font-size: 16px; }
    #info a { color: #fff; }
  </style>
</head>
<body>
  <div id="info">Ładowanie…</div>
  <script type="module">
    import { wczytajPrace, znajdzPrace, htmlModelu, DEKODERY } from './wspolne.js';

    const info = document.getElementById('info');
    try {
      const dane = await wczytajPrace();
      const id = new URLSearchParams(location.search).get('p');
      const praca = znajdzPrace(dane, id);
      document.title = `${praca.tytul} — AR 256 px`;
      info.innerHTML = `<b>${praca.tytul}</b> · ${praca.autor}<br><i>[test: śledzenie 256 px]</i> Skieruj aparat na znacznik. <a href="./">Wszystkie prace</a>`;

      const ar = window.AR; // ustawienia z ustawienia.js

      document.body.insertAdjacentHTML('beforeend', `
        <a-scene mindar-image="imageTargetSrc: ${praca.mind}; filterMinCF: ${ar.cf}; filterBeta: ${ar.beta}; warmupTolerance: ${ar.klatkiDoPokazania}; missTolerance: ${ar.klatkiDoUkrycia}"
                 renderer="colorManagement: true; antialias: true"
                 color-space="sRGB" vr-mode-ui="enabled: false"
                 device-orientation-permission-ui="enabled: false"
                 light="defaultLightsEnabled: false" ${DEKODERY}>
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          <!-- Światła poza znacznikiem: stałe względem telefonu, model obraca się pod nimi razem z kartką -->
          <a-entity light="type: ambient; intensity: ${ar.swiatloOtoczenia}"></a-entity>
          <a-entity light="type: directional; intensity: ${ar.slonceJasnosc}" position="${ar.slonceKierunek.join(' ')}"></a-entity>
          <a-entity mindar-image-target="targetIndex: 0">
            ${htmlModelu(praca)}
          </a-entity>
        </a-scene>`);
    } catch (e) {
      info.textContent = 'Błąd: ' + e.message;
    }
  </script>
</body>
</html>
