<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalibracja skali</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #e9e7e2; }
    #panel { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px;
             align-items: center; padding: 10px 16px; background: rgba(255,255,255,.9); font-size: 14px; }
    button { font: inherit; padding: 6px 10px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
    #opis { flex-basis: 100%; color: #444; }
  </style>
</head>
<body>
  <div id="panel">
    <button data-widok="gora">Widok z góry</button>
    <button data-widok="persp">Perspektywa</button>
    <label><input type="checkbox" id="przezr" checked> półprzezroczysty model</label>
    <a href="./">← wszystkie prace</a>
    <div id="opis"></div>
  </div>
  <script>
    AFRAME.registerComponent('przezroczystosc', {
      schema: { type: 'number', default: 1 },
      init() { this.el.addEventListener('model-loaded', () => this.update()); },
      update() {
        const mesh = this.el.getObject3D('mesh'); if (!mesh) return;
        mesh.traverse((o) => {
          if (!o.material) return;
          [].concat(o.material).forEach((m) => {
            m.transparent = this.data < 1; m.opacity = this.data; m.depthWrite = this.data >= 1; m.needsUpdate = true;
          });
        });
      },
    });
  </script>
  <script type="module">
    import { wczytajPrace, znajdzPrace, htmlModelu, transformacjaModelu, SWIATLA, DEKODERY } from './wspolne.js';

    const dane = await wczytajPrace();
    const praca = znajdzPrace(dane, new URLSearchParams(location.search).get('p'));
    const t = transformacjaModelu(praca);
    document.getElementById('opis').textContent =
      `${praca.tytul}: szerokość znacznika = ${praca.szerokoscZnacznika} jedn. modelu → skala ${(+t.skala.split(' ')[0]).toFixed(4)}. ` +
      `Model (półprzezroczysty) powinien dokładnie przykrywać rysunek znacznika.`;

    const img = new Image();
    img.src = praca.znacznik;
    await img.decode();
    const proporcja = img.naturalHeight / img.naturalWidth;

    document.body.insertAdjacentHTML('beforeend', `
      <a-scene renderer="colorManagement: true; antialias: true" vr-mode-ui="enabled: false" light="defaultLightsEnabled: false"
               background="color: #e9e7e2" ${DEKODERY}>
        <a-assets><img id="znacznik" src="${praca.znacznik}"></a-assets>
        <a-entity id="kamera" camera position="0 0 1.6" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
        ${SWIATLA}
        <a-plane src="#znacznik" width="1" height="${proporcja}" material="shader: flat"></a-plane>
        <a-plane width="1.02" height="${proporcja + 0.02}" position="0 0 -0.02" color="#333" material="shader: flat"></a-plane>
        ${htmlModelu(praca, 'przezroczystosc="0.55"')}
      </a-scene>`);

    const kamera = () => document.getElementById('kamera');
    // Widok z góry: kamera daleko z wąskim kątem ≈ rzut ortogonalny (jak rysunek znacznika)
    const widoki = {
      gora: { position: '0 0 40', rotation: '0 0 0', fov: 2.2 },
      persp: { position: '0 -1.4 1.2', rotation: '49 0 0', fov: 60 },
    };
    const ustawWidok = (nazwa) => {
      const w = widoki[nazwa];
      kamera().setAttribute('position', w.position);
      kamera().setAttribute('rotation', w.rotation);
      kamera().setAttribute('camera', { fov: w.fov, near: w.fov < 10 ? 30 : 0.01, far: 100 });
    };
    document.querySelectorAll('[data-widok]').forEach((b) => b.onclick = () => ustawWidok(b.dataset.widok));
    document.querySelector('a-scene').addEventListener('loaded', () => ustawWidok('gora'));
    document.getElementById('przezr').onchange = (e) => {
      document.querySelector('[przezroczystosc]').setAttribute('przezroczystosc', e.target.checked ? 0.55 : 1);
    };
  </script>
</body>
</html>
